# Multilingual GPU streaming profile: NVIDIA Nemotron 3.5 ASR Streaming 0.6B
# (cache-aware FastConformer encoder + RNNT decoder + a language-prompt
# vector). Requires a CUDA GPU and the `nemotron` extra
# (`nemo_toolkit[asr]>=3.0.0`).
#
# Why this profile exists: it is the only backend in this repo that serves
# Chinese AND English (plus 38 more locales) from ONE streaming model, with
# per-utterance automatic language identification. FunASR remains the better
# choice for Mandarin-only accuracy (zh-CN sits in NVIDIA's "broad-coverage"
# tier, FLEURS CER ~19-20%, while en-US is "transcription-ready"); this
# profile's value is one model, one GPU, mixed zh+en traffic.
#
# NOT run/verified anywhere yet — see docs/backends.md#nemotron for the
# honest verified-on note and docs/nemotron_a10_runbook.md for the A10
# bring-up procedure that is meant to close that gap.
server:
  host: 0.0.0.0
  port: 8000
vad:
  # silero, same rationale as configs/sherpa.yaml and configs/qwen3asr.yaml:
  # pair a production ASR backend with production-quality endpointing. The
  # backend has no native endpointing (native_endpointing=False), so the
  # server's VAD + endpointer decide utterance boundaries.
  kind: silero
  model_path: models/silero_vad.onnx
  threshold: 0.5
endpointing:
  pre_roll_ms: 300
  min_silence_ms: 500
  max_utterance_ms: 30000
stabilizer:
  min_partials: 2
  min_stable_ms: 400.0
backends:
  nemotron:
    type: nemotron
    options:
      # HF repo id (pulled by NeMo's own `from_pretrained` on first
      # backend.start()) or a local `.nemo` path. To pre-download the
      # 2.37 GB `.nemo` file into models/ instead:
      #   uv run python scripts/download_models.py nemotron-3.5-asr-streaming-0.6b
      # then point this at
      #   models/nemotron-3.5-asr-streaming-0.6b/nemotron-3.5-asr-streaming-0.6b.nemo
      model: nvidia/nemotron-3.5-asr-streaming-0.6b
      # Cache-aware attention context [left, right] in encoder output frames.
      # The encoder subsamples 8x, so one output frame is 80 ms of audio and
      # the streaming chunk is (right + 1) * 80 ms. right=6 -> 560 ms per
      # decode step, the model card's recommended accuracy/latency balance
      # Only the four right-context values the checkpoint was trained
      # with are accepted: 0/3/6/13 -> 80/320/560/1120 ms. Lower it to 3
      # (320 ms) or 0 (80 ms) to trade accuracy for latency; every value
      # is UNVERIFIED on real hardware.
      att_context_size: [56, 6]
      # null (or "auto") => automatic per-utterance language identification,
      # so a single server handles mixed zh + en traffic and reports the
      # detected locale on the FINAL event. Set to a locale ("zh-CN",
      # "en-US") to pin the language prompt instead; the OpenAI file
      # endpoint's `language` form field overrides this per request.
      language: null
      # The model emits a `<xx-XX>` locale tag in its output text; strip it
      # from the transcript (the detected locale is still reported
      # separately). Set false only if a client wants the raw tagged text.
      strip_lang_tags: true
      # "cuda", "cuda:N", or "cpu". Weights and caches run in fp32 (NeMo's
      # docs describe cache-aware models as fp32, with bf16/fp16 only via
      # AMP; the 3.0.0 wheel has no hard check for this, so it is UNVERIFIED).
      # CPU and MPS are UNVERIFIED and expected to be far slower than real time.
      device: cuda
      # torch.autocast(bfloat16) around the encoder step. UNVERIFIED — left
      # off so the default profile runs the model exactly as NeMo intends
      # (fp32). Flip to true on the A10 only after a measured comparison.
      amp: false
      # Size of the backend's shared ThreadPoolExecutor (the NeMo step call
      # is a synchronous, blocking torch call), mirroring `max_concurrent`
      # in configs/qwen3asr.yaml and `pool_workers` in the other backends.
      max_concurrent: 8
      # One throwaway silence decode at start() so the first real request
      # does not pay CUDA graph/kernel autotune cost.
      warmup: true
# Capacity cap (spec §13). Acquiring a session beyond max_sessions returns 429
# immediately instead of queueing on the GPU. Sized to the backend's
# max_concurrent decode pool. NOTE: the backend also holds a process-wide lock
# around each model step (the language prompt is set model-globally and CUDA
# calls are not thread-safe), so real concurrency is bounded by step time, not
# by pool size — the A10 concurrency ceiling is one of the UNVERIFIED items in
# docs/nemotron_a10_runbook.md. Also bounded per-request by
# max_session_seconds, enforced for file uploads in
# src/stt_server/api/transcriptions_http.py.
limits:
  max_sessions: 8
  max_session_seconds: 300.0
models:
  nemotron-3.5-asr-streaming-0.6b: nemotron
